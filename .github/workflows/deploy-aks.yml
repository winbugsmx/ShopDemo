# Build → push ACR → kubectl set image en Azure AKS (ShopDemo)
# Checklist secrets: .github/SECRETS-CHECKLIST.md
#
# Infra previa: Deploy-AzureShopDemo.ps1 -Mode AKS + kubectl apply inicial
# Trigger: push a main (apps o k8s) o workflow_dispatch

name: Deploy AKS

on:
  workflow_dispatch:
    inputs:
      apply_manifests:
        description: Apply k8s manifests (deployments, ingress, HPA)
        type: boolean
        default: false
      apply_infra:
        description: Include postgres/azurite (first-time cluster only)
        type: boolean
        default: false
      sync_secrets:
        description: Sync GitHub secrets to shopdemo-secrets
        type: boolean
        default: false
  push:
    branches: [main]
    paths:
      - 'Catalog/**'
      - 'Orders/**'
      - 'Inventory/**'
      - 'Aspire/ShopDemo.Analytics.Api/**'
      - 'AI/ShopDemo.Mcp.Api/**'
      - 'ShopDemo.Shared/**'
      - 'k8s/**'
      - '.github/workflows/deploy-aks.yml'
      - '.github/scripts/**'

permissions:
  contents: read

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      apps: ${{ steps.filter.outputs.apps }}
      k8s: ${{ steps.filter.outputs.k8s }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            apps:
              - 'Catalog/**'
              - 'Orders/**'
              - 'Inventory/**'
              - 'Aspire/ShopDemo.Analytics.Api/**'
              - 'AI/ShopDemo.Mcp.Api/**'
              - 'ShopDemo.Shared/**'
            k8s:
              - 'k8s/**'

  sync-secrets:
    if: github.event_name == 'workflow_dispatch' && inputs.sync_secrets == true
    environment: azure-aks
    runs-on: ubuntu-latest
    env:
      K8S_NAMESPACE: ${{ secrets.K8S_NAMESPACE || 'shopdemo' }}
    steps:
      - uses: actions/checkout@v4

      - uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - uses: azure/aks-set-context@v4
        with:
          resource-group: ${{ secrets.AZURE_RG }}
          cluster-name: ${{ secrets.AKS_CLUSTER_NAME }}

      - name: Sync Kubernetes secrets
        env:
          EVENT_HUBS_CONNECTION_STRING: ${{ secrets.EVENT_HUBS_CONNECTION_STRING }}
          PG_CATALOG_CONN: ${{ secrets.PG_CATALOG_CONN }}
          PG_ORDERS_CONN: ${{ secrets.PG_ORDERS_CONN }}
          PG_INVENTORY_CONN: ${{ secrets.PG_INVENTORY_CONN }}
          AZURITE_CHECKPOINT_CONN: ${{ secrets.AZURITE_CHECKPOINT_CONN }}
          POSTGRES_USER: ${{ secrets.POSTGRES_USER }}
          POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
        run: |
          chmod +x .github/scripts/sync-k8s-secrets.sh
          bash .github/scripts/sync-k8s-secrets.sh

  apply-manifests:
    needs: changes
    if: |
      (needs.changes.outputs.k8s == 'true' && github.event_name == 'push') ||
      (github.event_name == 'workflow_dispatch' && inputs.apply_manifests == true)
    environment: azure-aks
    runs-on: ubuntu-latest
    env:
      APPLY_INFRA: ${{ github.event_name == 'workflow_dispatch' && inputs.apply_infra == true && 'true' || 'false' }}
    steps:
      - uses: actions/checkout@v4

      - uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - uses: azure/aks-set-context@v4
        with:
          resource-group: ${{ secrets.AZURE_RG }}
          cluster-name: ${{ secrets.AKS_CLUSTER_NAME }}

      - name: Apply manifests
        run: |
          chmod +x .github/scripts/apply-k8s-manifests.sh
          bash .github/scripts/apply-k8s-manifests.sh k8s azure

  build-and-deploy:
    needs: changes
    if: needs.changes.outputs.apps == 'true' || github.event_name == 'workflow_dispatch'
    environment: azure-aks
    runs-on: ubuntu-latest
    env:
      ACR_NAME: ${{ secrets.ACR_NAME }}
      AZURE_RG: ${{ secrets.AZURE_RG }}
      AKS_CLUSTER_NAME: ${{ secrets.AKS_CLUSTER_NAME }}
      K8S_NAMESPACE: ${{ secrets.K8S_NAMESPACE || 'shopdemo' }}
    strategy:
      matrix:
        include:
          - service: catalog
            dockerfile: Catalog/ShopDemo.Catalog.Api/Dockerfile
            image: shopdemo-catalog
            deployment: shopdemo-catalog
            container: catalog-api
          - service: orders
            dockerfile: Orders/ShopDemo.Orders.Api/Dockerfile
            image: shopdemo-orders
            deployment: shopdemo-orders
            container: orders-api
          - service: inventory
            dockerfile: Inventory/ShopDemo.Inventory.Api/Dockerfile
            image: shopdemo-inventory
            deployment: shopdemo-inventory
            container: inventory-api
          - service: analytics
            dockerfile: Aspire/ShopDemo.Analytics.Api/Dockerfile
            image: shopdemo-analytics
            deployment: shopdemo-analytics
            container: analytics-api
          - service: mcp
            dockerfile: AI/ShopDemo.Mcp.Api/Dockerfile
            image: shopdemo-mcp
            deployment: shopdemo-mcp
            container: mcp-api

    steps:
      - uses: actions/checkout@v4

      - uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: ACR Login
        run: az acr login --name ${{ env.ACR_NAME }}

      - name: Build and push image
        run: |
          ACR_LOGIN=$(az acr show --name ${{ env.ACR_NAME }} --query loginServer -o tsv)
          IMAGE="$ACR_LOGIN/${{ matrix.image }}:${{ github.sha }}"
          docker build -f ${{ matrix.dockerfile }} -t "$IMAGE" -t "$ACR_LOGIN/${{ matrix.image }}:latest" .
          docker push "$IMAGE"
          docker push "$ACR_LOGIN/${{ matrix.image }}:latest"
          echo "IMAGE=$IMAGE" >> "$GITHUB_ENV"

      - uses: azure/aks-set-context@v4
        with:
          resource-group: ${{ env.AZURE_RG }}
          cluster-name: ${{ env.AKS_CLUSTER_NAME }}

      - name: Rollout deployment
        run: |
          chmod +x .github/scripts/deploy-k8s-image.sh
          bash .github/scripts/deploy-k8s-image.sh \
            "${{ matrix.deployment }}" \
            "${{ matrix.container }}" \
            "$IMAGE" \
            "${{ env.K8S_NAMESPACE }}"
