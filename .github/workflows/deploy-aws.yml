# Build y despliegue a Amazon ECS Fargate (ShopDemo)
#
# Secrets obligatorios (infra CI/CD):
#   AWS_ROLE_ARN (OIDC) o AWS_ACCESS_KEY_ID + AWS_SECRET_ACCESS_KEY
#   AWS_REGION, ECS_CLUSTER (opcionales con defaults)
#
# Secrets de configuración (runtime → SSM + env vars en task definitions):
#   EVENT_HUBS_CONNECTION_STRING, EVENT_HUB_NAME
#   PG_CATALOG_CONN, PG_ORDERS_CONN, PG_INVENTORY_CONN
#   AZURITE_CHECKPOINT_CONN (Inventory + Analytics)
#   INVENTORY_API_BASE_URL (Orders → Inventory vía Cloud Map)
#   MCP_CATALOG_URL, MCP_INVENTORY_URL, MCP_ANALYTICS_URL
#   LAB_PREFIX (opcional, default shopdemo)

name: Deploy AWS

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'Catalog/**'
      - 'Orders/**'
      - 'Inventory/**'
      - 'Aspire/ShopDemo.Analytics.Api/**'
      - 'AI/ShopDemo.Mcp.Api/**'
      - 'ShopDemo.Shared/**'
      - '.github/workflows/deploy-aws.yml'
      - '.github/scripts/sync-aws-ssm.sh'
      - '.github/scripts/deploy-ecs-service.sh'

permissions:
  id-token: write
  contents: read

jobs:
  sync-config:
    environment: aws
    runs-on: ubuntu-latest
    env:
      AWS_REGION: ${{ secrets.AWS_REGION || 'us-east-2' }}
      ECS_CLUSTER: ${{ secrets.ECS_CLUSTER || 'shopdemo-cluster' }}
      LAB_PREFIX: ${{ secrets.LAB_PREFIX || 'shopdemo' }}
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials (OIDC)
        if: ${{ secrets.AWS_ROLE_ARN != '' }}
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Configure AWS credentials (access key)
        if: ${{ secrets.AWS_ROLE_ARN == '' }}
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Sync GitHub secrets to SSM Parameter Store
        env:
          EVENT_HUBS_CONNECTION_STRING: ${{ secrets.EVENT_HUBS_CONNECTION_STRING }}
          PG_CATALOG_CONN: ${{ secrets.PG_CATALOG_CONN }}
          PG_ORDERS_CONN: ${{ secrets.PG_ORDERS_CONN }}
          PG_INVENTORY_CONN: ${{ secrets.PG_INVENTORY_CONN }}
          AZURITE_CHECKPOINT_CONN: ${{ secrets.AZURITE_CHECKPOINT_CONN }}
        run: |
          chmod +x .github/scripts/sync-aws-ssm.sh
          bash .github/scripts/sync-aws-ssm.sh

  build-and-deploy:
    needs: sync-config
    environment: aws
    runs-on: ubuntu-latest
    env:
      AWS_REGION: ${{ secrets.AWS_REGION || 'us-east-2' }}
      ECS_CLUSTER: ${{ secrets.ECS_CLUSTER || 'shopdemo-cluster' }}
      LAB_PREFIX: ${{ secrets.LAB_PREFIX || 'shopdemo' }}
    strategy:
      matrix:
        include:
          - service: catalog
            dockerfile: Catalog/ShopDemo.Catalog.Api/Dockerfile
            repository: shopdemo-catalog
            task_family: shopdemo-catalog
            container_name: catalog-api
          - service: orders
            dockerfile: Orders/ShopDemo.Orders.Api/Dockerfile
            repository: shopdemo-orders
            task_family: shopdemo-orders
            container_name: orders-api
          - service: inventory
            dockerfile: Inventory/ShopDemo.Inventory.Api/Dockerfile
            repository: shopdemo-inventory
            task_family: shopdemo-inventory
            container_name: inventory-api
          - service: analytics
            dockerfile: Aspire/ShopDemo.Analytics.Api/Dockerfile
            repository: shopdemo-analytics
            task_family: shopdemo-analytics
            container_name: analytics-api
          - service: mcp
            dockerfile: AI/ShopDemo.Mcp.Api/Dockerfile
            repository: shopdemo-mcp
            task_family: shopdemo-mcp
            container_name: mcp-api

    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials (OIDC)
        if: ${{ secrets.AWS_ROLE_ARN != '' }}
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Configure AWS credentials (access key)
        if: ${{ secrets.AWS_ROLE_ARN == '' }}
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push image
        env:
          ECR_REGISTRY: ${{ steps.ecr.outputs.registry }}
        run: |
          docker build -f ${{ matrix.dockerfile }} \
            -t "$ECR_REGISTRY/${{ matrix.repository }}:${{ github.sha }}" .
          docker push "$ECR_REGISTRY/${{ matrix.repository }}:${{ github.sha }}"

      - name: Deploy ECS service with new image and config
        env:
          ECR_REGISTRY: ${{ steps.ecr.outputs.registry }}
          EVENT_HUB_NAME: ${{ secrets.EVENT_HUB_NAME }}
          INVENTORY_API_BASE_URL: ${{ secrets.INVENTORY_API_BASE_URL }}
          MCP_CATALOG_URL: ${{ secrets.MCP_CATALOG_URL }}
          MCP_INVENTORY_URL: ${{ secrets.MCP_INVENTORY_URL }}
          MCP_ANALYTICS_URL: ${{ secrets.MCP_ANALYTICS_URL }}
        run: |
          chmod +x .github/scripts/deploy-ecs-service.sh
          bash .github/scripts/deploy-ecs-service.sh \
            "${{ matrix.task_family }}" \
            "${{ matrix.container_name }}" \
            "${{ env.ECS_CLUSTER }}" \
            "$ECR_REGISTRY/${{ matrix.repository }}:${{ github.sha }}" \
            "${{ env.AWS_REGION }}"
