# Build y despliegue a Azure Container Apps (ShopDemo)
#
# Trigger: push a rama main (merge de PR) o workflow_dispatch
# Checklist completo: .github/SECRETS-CHECKLIST.md
#
# GitHub environment: azure

name: Deploy Azure

on:
  workflow_dispatch:
  push:
    branches: [master]
    paths:
      - 'Source/Catalog/**'
      - 'Source/Orders/**'
      - 'Source/Inventory/**'
      - 'Source/Aspire/ShopDemo.Analytics.Api/**'
      - 'Source/AI/ShopDemo.Mcp.Api/**'
      - 'Source/ShopDemo.Shared/**'
      - '.github/workflows/deploy-azure.yml'
      - '.github/scripts/**'

jobs:
  build-and-deploy:
    environment: azure
    runs-on: ubuntu-latest
    env:
      ACR_NAME: ${{ secrets.ACR_NAME }}
      AZURE_RG: ${{ secrets.AZURE_RG }}
      ACA_ENV: ${{ secrets.ACA_ENV }}
    strategy:
      matrix:
        include:
          - service: catalog
            dockerfile: Source/Catalog/ShopDemo.Catalog.Api/Dockerfile
            image: shopdemo-catalog
            containerapp: ca-shopdemo-catalog
          - service: orders
            dockerfile: Source/Orders/ShopDemo.Orders.Api/Dockerfile
            image: shopdemo-orders
            containerapp: ca-shopdemo-orders
          - service: inventory
            dockerfile: Source/Inventory/ShopDemo.Inventory.Api/Dockerfile
            image: shopdemo-inventory
            containerapp: ca-shopdemo-inventory
          - service: analytics
            dockerfile: Source/Aspire/ShopDemo.Analytics.Api/Dockerfile
            image: shopdemo-analytics
            containerapp: ca-shopdemo-analytics
          - service: mcp
            dockerfile: Source/AI/ShopDemo.Mcp.Api/Dockerfile
            image: shopdemo-mcp
            containerapp: ca-shopdemo-mcp

    steps:
      - uses: actions/checkout@v4

      - name: Azure Login
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: ACR Login
        run: az acr login --name ${{ env.ACR_NAME }}

      - name: Build and push image
        run: |
          ACR_LOGIN=$(az acr show --name ${{ env.ACR_NAME }} --query loginServer -o tsv)
          docker build -f ${{ matrix.dockerfile }} -t "$ACR_LOGIN/${{ matrix.image }}:${{ github.sha }}" Source
          docker push "$ACR_LOGIN/${{ matrix.image }}:${{ github.sha }}"
          echo "ACR_LOGIN=$ACR_LOGIN" >> "$GITHUB_ENV"

      - name: Configure secrets and update Container App
        env:
          EVENT_HUBS_CONNECTION_STRING: ${{ secrets.EVENT_HUBS_CONNECTION_STRING }}
          EVENT_HUB_NAME: ${{ secrets.EVENT_HUB_NAME }}
          PG_CATALOG_CONN: ${{ secrets.PG_CATALOG_CONN }}
          PG_ORDERS_CONN: ${{ secrets.PG_ORDERS_CONN }}
          PG_INVENTORY_CONN: ${{ secrets.PG_INVENTORY_CONN }}
          STORAGE_CHECKPOINT_CONN: ${{ secrets.STORAGE_CHECKPOINT_CONN }}
          INVENTORY_API_BASE_URL: ${{ secrets.INVENTORY_API_BASE_URL }}
          MCP_CATALOG_URL: ${{ secrets.MCP_CATALOG_URL }}
          MCP_INVENTORY_URL: ${{ secrets.MCP_INVENTORY_URL }}
          MCP_ANALYTICS_URL: ${{ secrets.MCP_ANALYTICS_URL }}
        run: |
          chmod +x .github/scripts/configure-azure-containerapp.sh
          bash .github/scripts/configure-azure-containerapp.sh \
            "${{ matrix.service }}" \
            "${{ matrix.containerapp }}" \
            "${{ env.AZURE_RG }}" \
            "${ACR_LOGIN}/${{ matrix.image }}:${{ github.sha }}"
