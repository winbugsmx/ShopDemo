apiVersion: apps/v1
kind: Deployment
metadata:
  name: shopdemo-analytics
  namespace: shopdemo
spec:
  replicas: 1
  selector:
    matchLabels:
      app: shopdemo-analytics
  template:
    metadata:
      labels:
        app: shopdemo-analytics
    spec:
      containers:
        - name: analytics-api
          image: shopdemo-analytics:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
          env:
            - name: ASPNETCORE_ENVIRONMENT
              value: Production
            - name: EventHubs__Enabled
              value: "true"
            - name: EventHubs__ConnectionString
              valueFrom:
                secretKeyRef:
                  name: shopdemo-secrets
                  key: EVENT_HUBS_CONNECTION_STRING
            - name: EventHubs__EventHubName
              value: shopdemo-events
            - name: EventHubs__ConsumerGroup
              value: analytics-service
            - name: EventHubs__CheckpointStorageConnectionString
              valueFrom:
                secretKeyRef:
                  name: shopdemo-secrets
                  key: AZURITE_CHECKPOINT_CONN
            - name: EventHubs__CheckpointContainerName
              value: analytics-checkpoints
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
          readinessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 15
            periodSeconds: 10
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /alive
              port: 8080
            initialDelaySeconds: 30
            periodSeconds: 15
            failureThreshold: 3
