apiVersion: batch/v1
kind: Job
metadata:
  name: shopdemo-azurite-init
  namespace: shopdemo
spec:
  ttlSecondsAfterFinished: 300
  template:
    spec:
      restartPolicy: Never
      containers:
        - name: init-checkpoints
          image: python:3.12-slim
          env:
            - name: AZURITE_CONN
              valueFrom:
                secretKeyRef:
                  name: shopdemo-secrets
                  key: AZURITE_CHECKPOINT_CONN
          command:
            - /bin/bash
            - -ec
            - |
              pip install -q azure-storage-blob
              python - <<'PY'
              import os
              from azure.storage.blob import BlobServiceClient
              from azure.core.exceptions import ResourceExistsError

              client = BlobServiceClient.from_connection_string(os.environ["AZURITE_CONN"])
              for name in ("inventory-checkpoints", "analytics-checkpoints"):
                  try:
                      client.create_container(name)
                      print(f"created: {name}")
                  except ResourceExistsError:
                      print(f"exists: {name}")
              print("OK")
              PY
